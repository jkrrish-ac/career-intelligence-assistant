server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Same-origin proxy to the backend service, so the frontend's api/client.ts
    # can always call a relative /api path in dev and in prod alike.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # /chat/stream is Server-Sent Events — nginx buffers responses by
        # default, which would hold back every chunk until the stream ends.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}
